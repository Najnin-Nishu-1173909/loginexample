<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Profile | LU-TODO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f7f6;
        }

        .navbar{
            background:#123c34;
        }

        .navbar-brand{
            font-weight:bold;
        }

        .profile-card{
            max-width:900px;
            margin:auto;
        }

        .profile-image{

            width:150px;
            height:150px;
            border-radius:50%;
            object-fit:cover;
            border:5px solid #123c34;

        }

        .profile-placeholder{

            width:150px;
            height:150px;
            border-radius:50%;
            background:#dce8e4;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:55px;
            font-weight:bold;

            color:#123c34;

            border:5px solid #123c34;

        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand"
           href="{{ url_for('root') }}">
            LU-TODO
        </a>

        <ul class="navbar-nav ms-auto">

            <li class="nav-item">
                <a class="nav-link"
                   href="{{ url_for('student_home') }}">
                    Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link active"
                   href="{{ url_for('profile') }}">
                    Profile
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                   href="{{ url_for('logout') }}">
                    Log out
                </a>
            </li>

        </ul>

    </div>

</nav>


<div class="container py-5">

<div class="profile-card">

<div class="card shadow">

<div class="card-body p-5">


<div class="text-center mb-4">

{% if profile.profile_picture %}

<img
src="{{ url_for('static',
filename='profile_pictures/' ~ profile.profile_picture) }}"
class="profile-image">

{% else %}

<div class="profile-placeholder mx-auto">

{{ profile.first_name[0] }}{{ profile.last_name[0] }}

</div>

{% endif %}

<h2 class="mt-4">

{{ profile.first_name }}
{{ profile.last_name }}

</h2>

<p class="text-muted">

{{ profile.position }}

</p>

</div>

<hr>


<div class="row g-4">

<div class="col-md-6">

<label class="form-label fw-bold">

First Name

</label>

<input
type="text"
class="form-control"
value="{{ profile.first_name }}"
readonly>

</div>


<div class="col-md-6">

<label class="form-label fw-bold">

Last Name

</label>

<input
type="text"
class="form-control"
value="{{ profile.last_name }}"
readonly>

</div>


<div class="col-md-6">

<label class="form-label fw-bold">

Username

</label>

<input
type="text"
class="form-control"
value="{{ profile.email.split('@')[0] }}"
readonly>

</div>


<div class="col-md-6">

<label class="form-label fw-bold">

Email Address

</label>

<input
type="email"
class="form-control"
value="{{ profile.email }}"
readonly>

</div>


<div class="col-md-6">

<label class="form-label fw-bold">

Position

</label>

<input
type="text"
class="form-control"
value="{{ profile.position }}"
readonly>

</div>


<div class="col-md-6">

<label class="form-label fw-bold">

Role

</label>

<input
type="text"
class="form-control"
value="{{ profile.user_role|capitalize }}"
readonly>

</div>


<div class="col-md-6">

<label class="form-label fw-bold">

Status

</label>

<input
type="text"
class="form-control"
value="{{ profile.status|capitalize }}"
readonly>

</div>

</div>


<div class="mt-5 d-flex justify-content-between">

<a
href="{{ url_for('student_home') }}"
class="btn btn-outline-secondary">

← Back to Dashboard

</a>

<a
href="{{ url_for('logout') }}"
class="btn btn-danger">

Log out

</a>

</div>


</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
